services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: cove-change-me
      POSTGRES_DB: cove_relay
    volumes:
      - relay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove_relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  relay:
    build:
      context: ../..
      dockerfile: infra/relay/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
      - "4001:4001"
      - "4002:4002"
    volumes:
      - relay_state:/data/relay
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATABASE_URL: postgres://cove:cove-change-me@postgres:5432/cove_relay
      RELAY_DATA_DIR: /data/relay
      RELAY_AUTO_MIGRATE: "true"
      # Replace with your public HTTPS origin and OIDC provider settings:
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-http://localhost:8787}
      RELAY_OIDC_ISSUER: ${RELAY_OIDC_ISSUER:?Set RELAY_OIDC_ISSUER}
      RELAY_OIDC_CLIENT_ID: ${RELAY_OIDC_CLIENT_ID:-cove-app}
      RELAY_OIDC_AUDIENCE: ${RELAY_OIDC_AUDIENCE:-}
      RELAY_OIDC_SCOPES: ${RELAY_OIDC_SCOPES:-openid,profile,email}
      RELAY_LIBP2P_ENABLED: "true"
      RELAY_LIBP2P_LISTEN: /ip4/0.0.0.0/tcp/4001,/ip4/0.0.0.0/tcp/4002/ws
      RELAY_LIBP2P_ANNOUNCE: ${RELAY_LIBP2P_ANNOUNCE:-}
      RELAY_TUNNEL_NAMESPACE: ${RELAY_TUNNEL_NAMESPACE:-selfhosted}
      RELAY_MAX_MANAGED_TUNNELS: ${RELAY_MAX_MANAGED_TUNNELS:-20}

volumes:
  relay_pg_data:
  relay_state:
