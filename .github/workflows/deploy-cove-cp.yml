name: Cove control panel image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches: [covecode]
    paths:
      - ".github/workflows/deploy-cove-cp.yml"
      - "infra/cp/**"
      - "packages/**"
      - "patches/**"
      - ".pnpmfile.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cove
          POSTGRES_PASSWORD: cove-test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      IMAGE: ghcr.io/reonokiy/cove-cp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Build image
        run: docker build -f infra/cp/Dockerfile --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$IMAGE:$GITHUB_SHA" .
      - name: Verify migrations and control panel discovery
        run: |
          docker run -d --name cove-cp --network host \
            -e DATABASE_URL=postgres://postgres:cove-test@127.0.0.1:5432/cove \
            -e COVE_CP_PUBLIC_URL=http://127.0.0.1:8787 \
            -e COVE_CP_DATA_DIR=/tmp/cove \
            "$IMAGE:$GITHUB_SHA"
          trap 'docker logs cove-cp; docker rm -f cove-cp' EXIT
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8787/.well-known/cove-control-plane | jq -e \
            '.controlPlaneUrl == "http://127.0.0.1:8787" and (.libp2p.peerId | type == "string")'
      - name: Publish versioned image
        if: inputs.publish && github.repository == 'reonokiy/covecode' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"
